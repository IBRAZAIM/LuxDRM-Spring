<article th:fragment="productCard(product)" class="uxd-card" th:with="
            rawPrice=${product.price != null ? product.price : T(java.math.BigDecimal).ZERO},
            rawDisc=${product.discount != null ? product.discount : T(java.math.BigDecimal).ZERO},
            discInt=${rawDisc.intValue()},
            hasDisc=${discInt > 0},
            finalPrice=${product.finalPrice},
            catName=${product.category != null and product.category.name != null ? product.category.name : 'Коллекция UXD'},
            hasImages=${product.images != null and !#lists.isEmpty(product.images)},
            hasMultiImg=${product.images != null and #lists.size(product.images) > 1},
            hasCustomSizes=${product.sizes != null and !#lists.isEmpty(product.sizes)},
            availSizes=${hasCustomSizes ? #strings.listJoin(product.sizes.?[stock == null or stock > 0].![size], ',') : 'XS,S,M,L,XL'},
            inStock=${(product.stock == null or product.stock > 0) and (!hasCustomSizes or !#lists.isEmpty(product.sizes.?[stock == null or stock > 0]))}
         " th:attr="
            data-id=${product.id},
            data-name=${product.name},
            data-cat=${catName},
            data-cat-id=${product.category != null ? product.category.id : ''},
            data-audience=${product.safeAudience.name()},
            data-price=${rawPrice},
            data-final-price=${finalPrice},
            data-disc=${discInt},
            data-rating=${product.rating > 0 ? product.rating : 0},
            data-sizes=${availSizes},
            data-in-stock=${inStock}
         ">

    <!-- ── ФОТО + БЕЙДЖ ── -->
    <a th:href="@{'/products/' + ${product.id}}" class="uxd-card__media" th:classappend="${hasMultiImg} ? 'has-second-img' : ''" th:attr="aria-label=${product.name}">
        <div class="uxd-card__track">
            <th:block th:if="${hasImages}">
                <img th:each="im : ${product.images}"
                     th:src="${(im != null and im.image != null) ? im.image : '/images/product-placeholder.svg'}"
                     th:alt="${product.name}"
                     class="uxd-card__img uxd-card__slide"
                     loading="lazy"
                     onerror="this.onerror=null;this.src='/images/product-placeholder.svg';">
            </th:block>
            <img th:unless="${hasImages}"
                 src="/images/product-placeholder.svg"
                 th:alt="${product.name}"
                 class="uxd-card__img uxd-card__slide"
                 loading="lazy">
        </div>
        <div class="uxd-card__dots" th:if="${hasMultiImg}" aria-hidden="true">
            <span th:each="im, st : ${product.images}" class="uxd-card__dot" th:classappend="${st.index == 0 ? ' is-active' : ''}"></span>
        </div>
        <span class="uxd-card__badge" th:if="${hasDisc}" th:text="'−' + ${discInt} + '%'">−15%</span>
    </a>

    <button type="button" class="uxd-card__wish" aria-label="Добавить в избранное"
        th:attr="data-product-id=${product.id}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
    </button>

    <!-- ── ИНФОРМАЦИЯ ── -->
    <div class="uxd-card__body">
        <div class="uxd-card__meta">
            <span class="uxd-card__category" th:text="${catName}">Пижамы</span>
        </div>

        <a th:href="@{'/products/' + ${product.id}}" class="uxd-card__title" th:text="${product.name}">Название
            модели</a>

        <div class="uxd-card__price" th:classappend="${hasDisc} ? 'uxd-card__price--sale' : ''">
            <span class="uxd-card__price-current"
                th:text="${#numbers.formatInteger(finalPrice.intValue(), 1, 'WHITESPACE')} + ' ₸'">18 900 ₸</span>
            <span class="uxd-card__price-old" th:if="${hasDisc}">
                <span class="uxd-card__price-old-num" th:text="${#numbers.formatInteger(rawPrice.intValue(), 1, 'WHITESPACE')}">22 000</span>&nbsp;₸
            </span>
        </div>

        <button type="button" class="uxd-card__cart" aria-expanded="false"
            th:disabled="${!inStock}"
            th:classappend="${!inStock} ? ' uxd-card__cart--out' : ''"
            th:attr="aria-controls='uxd-sizes-' + ${product.id}">
            <svg class="uxd-card__cart-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span th:text="${inStock ? 'В корзину' : 'Нет в наличии'}">В корзину</span>
        </button>
    </div>

    <!-- ── ПОПОВЕР ВЫБОРА РАЗМЕРА ── -->
    <div class="uxd-card__sizes" th:id="'uxd-sizes-' + ${product.id}" role="dialog" aria-label="Выберите размер">
        <div class="uxd-card__sizes-head">
            <span>Выберите размер</span>
            <button type="button" class="uxd-card__sizes-close" aria-label="Закрыть">✕</button>
        </div>

        <form th:action="@{'/cart/' + ${product.id}}" method="post">
            <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
            <input type="hidden" name="quantity" value="1">
            <input type="hidden" name="size" value="">

            <div class="uxd-card__sizes-grid">
                <th:block th:if="${hasCustomSizes}">
                    <button type="button" class="uxd-card__size" th:each="sz : ${product.sizes}" th:text="${sz.size}"
                        th:attr="data-size=${sz.size}"
                        th:disabled="${sz.stock != null and sz.stock <= 0}"
                        th:classappend="${sz.stock != null and sz.stock <= 0} ? ' uxd-card__size--out' : ''"
                        th:title="${sz.stock != null and sz.stock <= 0 ? 'Нет в наличии' : 'В наличии'}">41</button>
                </th:block>
                <th:block th:unless="${hasCustomSizes}">
                    <button type="button" class="uxd-card__size" th:each="s : ${'XS,S,M,L,XL'.split(',')}"
                        th:text="${s}" th:attr="data-size=${s}">M</button>
                </th:block>
            </div>
        </form>
    </div>
</article>
