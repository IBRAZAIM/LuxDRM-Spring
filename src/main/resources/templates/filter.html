<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Фильтр товаров</title>
</head>
<body>
<div class="filter-container">
    <form method="get" th:action="@{/products}" th:fragment="filter-div" class="filter-form" onsubmit="return validateFilterForm(event);">
        <div class="form-group form-group--search">
            <label for="search">Поиск по каталогу</label>
            <div class="input-with-icon">
                <i class="fas fa-search"></i>
                <input type="text" id="search" name="search"
                       th:value="${search}" placeholder="Название или описание товара..." title="Поиск товаров">
            </div>
        </div>

        <div class="form-group">
            <label for="categoryId" class="category-label">Категория</label>
            <select id="categoryId" name="categoryId" class="category">
                <option value="">Все категории</option>
                <option th:each="category : ${categories}"
                        th:value="${category.id}"
                        th:text="${category.getName()}"
                        th:selected="${category.id == selectedCategoryId}">
                </option>
            </select>
        </div>

        <div class="form-group form-group--price">
            <label for="minPrice">Цена от (₸)</label>
            <input type="number" id="minPrice" name="minPrice" step="100" min="0"
                   th:value="${param.minPrice}" placeholder="0" title="Введите минимальную цену">
            <span id="minPriceError" class="error-message"></span>
        </div>

        <div class="form-group form-group--price">
            <label for="maxPrice">Цена до (₸)</label>
            <input type="number" id="maxPrice" name="maxPrice" step="100" min="0"
                   th:value="${param.maxPrice}" placeholder="Любая" title="Введите максимальную цену">
            <span id="maxPriceError" class="error-message"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="filter-btn">
                <i class="fas fa-sliders-h"></i> Применить
            </button>
            <a th:href="@{/products}" class="reset-btn" title="Сбросить фильтры">
                Сбросить
            </a>
        </div>
    </form>
</div>
</body>
</html>
