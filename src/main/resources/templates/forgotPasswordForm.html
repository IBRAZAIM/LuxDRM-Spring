<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UXD — Восстановление пароля</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/tokens.css}">
    <link rel="stylesheet" th:href="@{/authorizationForm.css}">
</head>
<body>
<div class="card">
    <a th:href="@{/}" class="brand" aria-label="На главную UXD">Under <span class="brand-x">X</span> Desire</a>
    <h2>Восстановление пароля</h2>

    <div th:if="${error}" class="error" role="alert" th:text="${error}"></div>

    <div th:if="${successMessage}" class="success" role="status">
        <div th:text="${successMessage}"></div>
    </div>

    <form th:action="@{/forgot-password}" method="post">
        <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>

        <div class="field">
            <label for="email">Email или логин аккаунта</label>
            <input type="text" id="email" name="email" placeholder="name@example.com" autocomplete="username" required>
        </div>

        <button type="submit">Получить ссылку сброса</button>
    </form>

    <p class="foot">Вспомнили пароль? <a th:href="@{/login}">Войти</a></p>
    <a th:href="@{/}" class="back-home">← Вернуться в магазин</a>
</div>
</body>
</html>
