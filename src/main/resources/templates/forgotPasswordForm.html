<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UXD — Восстановление пароля</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/authorizationForm.css}">
</head>
<body>
<div class="card">
    <p class="brand">Under <span class="brand-x">X</span> Desire</p>
    <h2>Восстановление пароля</h2>

    <div th:if="${error}" class="error" role="alert" th:text="${error}"></div>

    <div th:if="${successMessage}" style="background: #ecfdf5; color: #065f46; padding: 12px 14px; border-radius: 0; font-size: 12px; margin-bottom: 16px; border: 1px solid #a7f3d0; line-height: 1.5;">
        <div th:text="${successMessage}"></div>
        <div th:if="${resetLink != null}" style="margin-top: 10px; word-break: break-all;">
            <strong>Быстрая ссылка (локальный режим):</strong><br>
            <a th:href="${resetLink}" th:text="${resetLink}" style="color: #0a0a2e; font-weight: 600;"></a>
        </div>
    </div>

    <form th:action="@{/forgot-password}" method="post">
        <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>

        <div class="field">
            <label for="email">Email или логин аккаунта</label>
            <input type="text" id="email" name="email" placeholder="name@example.com" required>
        </div>

        <button type="submit">Получить ссылку сброса</button>
    </form>

    <p class="foot">Вспомнили пароль? <a th:href="@{/login}">Войти</a></p>
</div>
</body>
</html>
