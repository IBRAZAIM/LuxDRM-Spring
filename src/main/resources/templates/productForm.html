<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Создание товара — UXD</title>
  <link rel="stylesheet" th:href="@{/updateForm.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="container">
  <div style="margin-bottom: 16px;">
    <a th:href="@{/products}" style="color: #6b6b85; text-decoration: none; font-size: 13px; font-weight: 600;">← Назад к списку товаров</a>
  </div>
  <h1>Создание товара</h1>
  <p class="subtitle">Категория: <strong th:text="${category != null ? category.name : 'Не выбрана'}">Категория</strong></p>

  <div th:if="${error}" class="alert-error" th:text="${error}"></div>

  <form th:action="@{/products/create(categoryId=${category != null ? category.id : ''})}" th:object="${product}" method="post" enctype="multipart/form-data">
    <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
    <input type="hidden" name="categoryId" th:value="${category != null ? category.id : ''}">

    <!-- Основная информация -->
    <div class="form-section">
      <div class="form-group">
        <label>Название товара</label>
        <input type="text" name="name" th:field="*{name}" placeholder="Например: Шелковая пижама UXD" maxlength="255" required>
      </div>

      <div class="form-row-grid">
        <div class="form-group">
          <label>Цена (₸)</label>
          <input type="number" name="price" th:field="*{price}" placeholder="45000" min="0" step="1" required>
        </div>
        <div class="form-group">
          <label>Скидка (%)</label>
          <input type="number" name="discount" th:field="*{discount}" placeholder="0" value="0" min="0" max="99" step="1">
        </div>
        <div class="form-group">
          <label>Остаток на складе (шт.)</label>
          <input type="number" name="stock" th:field="*{stock}" placeholder="100" value="100" min="0" required>
        </div>
      </div>

      <div class="form-group">
        <label>Описание</label>
        <textarea name="description" th:field="*{description}" placeholder="Подробное описание модели, посадки и ухода" maxlength="5000"></textarea>
      </div>
    </div>

    <!-- Характеристики -->
    <div class="form-section" th:if="${category != null and category.optionList != null and !category.optionList.isEmpty()}">
      <label>Характеристики категории</label>
      <div class="options-list">
        <div class="option-row" th:each="option : ${category.optionList}">
          <span class="option-name" th:text="${option.name}"></span>
          <input type="hidden" name="optionsIds" th:value="${option.id}" th:if="${option.id != null}">
          <input type="text" name="values" placeholder="Введите значение">
        </div>
      </div>
    </div>

    <!-- Размеры -->
    <div class="form-section">
      <div class="section-header">
        <label>Размеры</label>
        <div class="preset-chips">
          <button type="button" class="preset-chip" onclick="addPresetSizes(['XS','S','M','L','XL'])">+ XS–XL</button>
          <button type="button" class="preset-chip" onclick="addPresetSizes(['S','M','L'])">+ S–L</button>
          <button type="button" class="preset-chip" onclick="addPresetSizes(['One Size'])">+ One Size</button>
        </div>
      </div>
      <div id="sizes" class="items-list" data-empty-text="Пока нет размеров. Выберите шаблон выше или нажмите +.">
        <span class="empty-text">Пока нет размеров. Выберите шаблон выше или нажмите +.</span>
      </div>
      <button type="button" class="add-product-btn" onclick="addSizeItem('')" title="Добавить размер">
        <i class="fas fa-plus"></i>
      </button>
    </div>

    <!-- Изображения (Загрузка файлов) -->
    <div class="form-section">
      <label>Фотографии товара</label>
      <input type="file" id="imageFilesInput" name="imageFiles" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple style="display: none;">

      <div class="upload-dropzone" id="uploadDropzone">
        <i class="fas fa-cloud-upload-alt upload-dropzone__icon"></i>
        <span class="upload-dropzone__title">Нажмите для выбора фото или перетащите файлы сюда</span>
        <span class="upload-dropzone__hint">Поддерживаются JPG, PNG, WEBP, AVIF (до 10 МБ на файл). Первое фото станет главным.</span>
      </div>

      <div class="upload-previews" id="uploadPreviews"></div>
    </div>

    <!-- Submit -->
    <div class="form-actions">
      <button type="submit" class="btn-primary">Создать товар</button>
    </div>
  </form>
</div>
<script>
  function addSizeItem(initialValue) {
    const list = document.getElementById('sizes');
    const emptyText = list.querySelector('.empty-text');
    if (emptyText) emptyText.remove();

    const container = document.createElement('div');
    container.className = 'option-row';
    container.style.display = 'flex';
    container.style.alignItems = 'center';
    container.style.gap = '6px';

    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = 'Размер';
    input.name = 'sizes';
    if (initialValue) {
      input.value = initialValue;
    }
    container.appendChild(input);

    const removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-btn';
    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
    removeBtn.onclick = () => { container.remove(); checkEmpty(list); };
    container.appendChild(removeBtn);

    list.appendChild(container);
  }

  function addPresetSizes(sizesArray) {
    const existing = Array.from(document.querySelectorAll('#sizes input[name="sizes"], #sizes input[name="sizes[]"]'))
      .map(inp => inp.value.trim().toUpperCase());
    sizesArray.forEach(size => {
      if (!existing.includes(size.toUpperCase())) {
        addSizeItem(size);
      }
    });
  }

  function checkEmpty(list) {
    if (!list.querySelector('.option-row')) {
      const empty = document.createElement('span');
      empty.className = 'empty-text';
      empty.innerText = list.dataset.emptyText;
      list.appendChild(empty);
    }
  }

  const fileInput = document.getElementById('imageFilesInput');
  const dropzone = document.getElementById('uploadDropzone');
  const previewsContainer = document.getElementById('uploadPreviews');
  const selectedFiles = [];

  function syncInputFiles() {
    const dt = new DataTransfer();
    selectedFiles.forEach(file => dt.items.add(file));
    fileInput.files = dt.files;
    renderPreviews();
  }

  function addFiles(fileList) {
    Array.from(fileList).forEach(file => {
      if (file.type && file.type.startsWith('image/')) {
        selectedFiles.push(file);
      }
    });
    syncInputFiles();
  }

  function renderPreviews() {
    previewsContainer.innerHTML = '';
    selectedFiles.forEach((file, idx) => {
      const card = document.createElement('div');
      card.className = 'upload-preview-card';

      const img = document.createElement('img');
      img.src = URL.createObjectURL(file);
      img.alt = file.name;
      card.appendChild(img);

      if (idx === 0) {
        const badge = document.createElement('span');
        badge.className = 'upload-preview-card__badge';
        badge.textContent = 'Главное фото';
        card.appendChild(badge);
      }

      const removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'upload-preview-card__remove';
      removeBtn.title = 'Удалить фото';
      removeBtn.innerHTML = '<i class="fas fa-times"></i>';
      removeBtn.onclick = () => {
        selectedFiles.splice(idx, 1);
        syncInputFiles();
      };
      card.appendChild(removeBtn);

      previewsContainer.appendChild(card);
    });
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', (e) => {
    if (e.target.files && e.target.files.length > 0) {
      addFiles(e.target.files);
    }
  });

  dropzone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropzone.classList.add('is-dragover');
  });
  dropzone.addEventListener('dragleave', () => {
    dropzone.classList.remove('is-dragover');
  });
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('is-dragover');
    if (e.dataTransfer && e.dataTransfer.files) {
      addFiles(e.dataTransfer.files);
    }
  });

  document.addEventListener('DOMContentLoaded', () => {
    addPresetSizes(['XS', 'S', 'M', 'L', 'XL']);
  });
</script>
</body>
</html>
