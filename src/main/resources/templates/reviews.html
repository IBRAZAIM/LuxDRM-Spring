<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Модерация отзывов — UXD Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/reviews.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:insert="~{navbar :: navigation-panel}"></div>

<main class="admin-shell">
    <div class="review-container">

        <div class="admin-topbar">
            <nav class="admin-breadcrumb" aria-label="Навигация">
                <a th:href="@{/}">Главная</a>
                <span class="sep">/</span>
                <span>Администрирование</span>
                <span class="sep">/</span>
                <span class="cur">Отзывы</span>
            </nav>

            <div class="admin-nav-pills">
                <a th:href="@{/products}" class="admin-pill">
                    <i class="fas fa-boxes-stacked"></i> Товары
                </a>
                <a th:href="@{/orders}" class="admin-pill">
                    <i class="fas fa-clipboard-list"></i> Заказы
                </a>
                <a th:href="@{/categories}" class="admin-pill">
                    <i class="fas fa-folder"></i> Категории
                </a>
                <a th:href="@{/reviews}" class="admin-pill active">
                    <i class="fas fa-star"></i> Отзывы
                </a>
                <a th:href="@{/sales}" class="admin-pill">
                    <i class="fas fa-chart-line"></i> Аналитика
                </a>
            </div>
        </div>

        <header class="admin-header">
            <div>
                <span class="admin-eyebrow">Панель управления UXD</span>
                <h1 class="myCart">Модерация отзывов</h1>
            </div>
            <span class="total-badge" th:text="'Всего отзывов: ' + ${reviews != null ? #lists.size(reviews) : 0}"></span>
        </header>

        <div th:if="${successMessage}" class="alert alert-success" role="status">
            <div><i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span></div>
            <button type="button" class="alert-close" onclick="this.parentElement.remove()">✕</button>
        </div>

        <div class="review-list" th:if="${reviews != null and !#lists.isEmpty(reviews)}">
            <table>
                <thead>
                <tr class="reviews-param">
                    <th>Пользователь</th>
                    <th>Товар</th>
                    <th>Оценка и текст</th>
                    <th>Дата</th>
                    <th>Статус публикации</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="review : ${reviews}" class="review-item">
                    <td class="review-user">
                        <strong th:text="${review.user != null and review.user.name != null ? review.user.name : (review.user != null ? review.user.login : 'Гость')}"></strong>
                        <span class="user-sub" th:if="${review.user != null}" th:text="${review.user.login}"></span>
                    </td>
                    <td class="review-product">
                        <a th:if="${review.product != null}"
                           th:href="@{'/products/' + ${review.product.id}}"
                           class="prod-link"
                           th:text="${review.product.name}"></a>
                        <span th:if="${review.product == null}" class="muted">Товар удалён</span>
                    </td>
                    <td class="review-body">
                        <div class="stars-row">
                            <span th:each="s : ${#numbers.sequence(1, 5)}"
                                  class="star"
                                  th:classappend="${s <= review.estimation} ? ' filled' : ''">★</span>
                            <span class="score-num" th:text="${review.estimation} + ' / 5'"></span>
                        </div>
                        <p class="review-text" th:text="${review.text != null and !review.text.isEmpty() ? review.text : 'Без текста'}"></p>
                    </td>
                    <td class="review-date"
                        th:text="${review.date != null ? #temporals.format(review.date, 'dd.MM.yyyy HH:mm') : '—'}"></td>
                    <td class="review-status-cell">
                        <div class="status-wrap"
                             th:with="stName=${review.status != null ? review.status.name() : 'PENDING'},
                                      stDisplay=${review.status != null ? review.status.displayName : 'Не проверено'}">
                            <span class="status-badge"
                                  th:classappend="${stName == 'APPROVED'} ? ' status-badge--approved' : ' status-badge--pending'"
                                  th:text="${stDisplay}"></span>

                            <form th:action="@{/reviews/updateStatus}" method="post" class="status-form">
                                <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
                                <input type="hidden" th:name="reviewId" th:value="${review.id}">
                                <select th:name="status" class="status-select">
                                    <option th:each="statusOption : ${T(kz.ibrazaim.catalog.model.ReviewStatus).values()}"
                                            th:value="${statusOption.name()}"
                                            th:text="${statusOption.displayName}"
                                            th:selected="${review.status == statusOption}">
                                    </option>
                                </select>
                                <button type="submit" class="save-btn">Сохранить</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="empty-reviews" th:if="${reviews == null or #lists.isEmpty(reviews)}">
            <i class="far fa-comment-dots"></i>
            <h3>Отзывов пока нет</h3>
            <p>Когда покупатели оставят отзывы к товарам, они появятся здесь для проверки.</p>
        </div>

    </div>
</main>

<div th:insert="~{footer :: footer-code}"></div>
<script th:src="@{/js/navbar-component.js}" defer></script>
</body>
</html>
