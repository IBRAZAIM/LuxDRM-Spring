<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit != null and isEdit ? 'Редактирование категории — UXD Admin' : 'Создание категории — UXD Admin'}">Категория — UXD Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/admin.css}">
    <link rel="stylesheet" th:href="@{/updateForm.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
<div th:insert="~{navbar :: navigation-panel}"></div>
<div class="admin-form-shell">
    <div th:replace="~{fragments/admin-topbar :: subpageTopbar('categories', 'Категории', '/categories', ${isEdit != null and isEdit ? 'Редактирование' : 'Новая категория'})}"></div>
<div class="container">
    <a th:href="@{/categories}" style="display:inline-block;margin-bottom:16px;color:#6b6b85;text-decoration:none;font-size:13px;font-weight:600;">← Назад к категориям</a>
    <h1 th:text="${isEdit != null and isEdit ? 'Редактирование категории' : 'Создание категории'}">Создание категории</h1>
    <p class="subtitle">Категория определяет набор характеристик для карточек товаров</p>

    <div th:if="${errorMessage}" class="alert-error" th:text="${errorMessage}"></div>

    <form th:action="${isEdit != null and isEdit ? '/categories/update/' + category.id : '/categories/create'}"
          th:object="${category}"
          method="post"
          id="categoryForm">
        <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>

        <!-- Название -->
        <div class="form-group">
            <label for="name">Название категории</label>
            <input id="name" type="text" th:field="*{name}" placeholder="Например: Шелковые пижамы, Домашние костюмы" required>
            <span class="error" id="nameError"></span>
        </div>

        <!-- Текущие характеристики (при редактировании) -->
        <div class="form-section" th:if="${isEdit != null and isEdit and existingOptions != null and !existingOptions.isEmpty()}">
            <div class="section-header">
                <label>Существующие характеристики категории</label>
            </div>
            <div class="options-list">
                <div class="option-row" th:each="opt : ${existingOptions}">
                    <span class="option-name" th:text="${opt.name}" style="color: #0c0c3d; font-weight: 600;"></span>
                </div>
            </div>
        </div>

        <!-- Новые характеристики -->
        <div class="form-section">
            <div class="section-header">
                <label th:text="${isEdit != null and isEdit ? 'Добавить новые характеристики' : 'Характеристики категории'}">Характеристики</label>
                <span class="hint">Например: Состав ткани, Плотность, Посадка, Страна производства</span>
            </div>

            <div id="characterContainer" class="options-list empty">
                <span class="empty-text">Дополнительные характеристики не добавлены (необязательно)</span>
            </div>

            <button type="button" class="add-product-btn" onclick="addCharacter()" aria-label="Добавить характеристику" title="Добавить характеристику">
                <i class="fas fa-plus"></i><span>Добавить характеристику</span>
            </button>
        </div>

        <!-- Действие -->
        <div class="form-actions sticky">
            <a th:href="@{/categories}" class="btn-secondary">Отмена</a>
            <button type="submit" class="btn-primary" th:text="${isEdit != null and isEdit ? 'Сохранить изменения' : 'Создать категорию'}">Создать категорию</button>
        </div>
    </form>
</div>
</div>
<script>
    function addCharacter() {
        const container = document.getElementById("characterContainer");
        container.classList.remove("empty");
        container.querySelector(".empty-text")?.remove();

        const row = document.createElement("div");
        row.className = "option-row";

        const input = document.createElement("input");
        input.type = "text";
        input.name = "optionNames";
        input.placeholder = "Например: Состав ткани, Посадка, Уход за изделием";

        const removeBtn = document.createElement("button");
        removeBtn.type = "button";
        removeBtn.className = "remove-btn";
        removeBtn.setAttribute("aria-label", "Удалить характеристику");
        removeBtn.innerHTML = `<i class="fas fa-times"></i>`;

        removeBtn.onclick = () => {
            row.remove();
            if (!container.children.length) {
                container.classList.add("empty");
                container.innerHTML = `<span class="empty-text">Дополнительные характеристики не добавлены (необязательно)</span>`;
            }
        };

        row.appendChild(input);
        row.appendChild(removeBtn);
        container.appendChild(row);
        input.focus();
    }

    document.getElementById("categoryForm").addEventListener("submit", function (event) {
        const nameInput = document.getElementById("name");
        const errorSpan = document.getElementById("nameError");

        if (nameInput.value.trim() === "") {
            errorSpan.textContent = "Пожалуйста, введите название категории";
            event.preventDefault();
        } else {
            errorSpan.textContent = "";
        }
    });
</script>
<script th:src="@{/js/navbar-component.js}" defer></script>
</body>
</html>
