<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Категории товаров — UXD Admin</title>
    <meta name="description" content="Категории товаров UXD: пижамы, домашняя одежда, детские коллекции и lounge-позиции." />
    <link rel="canonical" th:href="${canonicalUrl}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/categoryList.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div th:insert="~{navbar :: navigation-panel}" class="navigation-panel"></div>

<main class="admin-shell">
    <div class="container">

        <div class="admin-topbar">
            <nav class="admin-breadcrumb" aria-label="Навигация">
                <a th:href="@{/}">Главная</a>
                <span class="sep">/</span>
                <span>Администрирование</span>
                <span class="sep">/</span>
                <span class="cur">Категории</span>
            </nav>

            <div class="admin-nav-pills">
                <a th:href="@{/products}" class="admin-pill">
                    <i class="fas fa-boxes-stacked"></i> Товары
                </a>
                <a th:href="@{/orders}" class="admin-pill">
                    <i class="fas fa-clipboard-list"></i> Заказы
                </a>
                <a th:href="@{/categories}" class="admin-pill active">
                    <i class="fas fa-folder"></i> Категории
                </a>
                <a th:href="@{/reviews}" class="admin-pill">
                    <i class="fas fa-star"></i> Отзывы
                </a>
                <a th:href="@{/sales}" class="admin-pill">
                    <i class="fas fa-chart-line"></i> Аналитика
                </a>
            </div>
        </div>

        <div th:if="${successMessage}" class="alert alert-success" role="status"
             style="background:#ECFDF5;border:1px solid #A7F3D0;color:#065F46;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13px;font-weight:500;">
            <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
        </div>
        <div th:if="${errorMessage}" class="alert alert-error" role="alert"
             style="background:#FEF2F2;border:1px solid #FECACA;color:#991B1B;padding:12px 16px;border-radius:8px;margin-bottom:18px;font-size:13px;font-weight:500;">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
        </div>

        <header class="admin-header">
            <div>
                <span class="admin-eyebrow">Панель управления UXD</span>
                <h1>Категории товаров</h1>
            </div>
            <div class="header-actions">
                <span class="total-badge" th:text="'Всего: ' + ${categories != null ? #lists.size(categories) : 0}"></span>
                <a th:href="@{'/categories/create'}" class="btn-create-category">
                    <i class="fas fa-plus"></i> Добавить категорию
                </a>
            </div>
        </header>

        <div class="table-wrap" th:if="${categories != null and !#lists.isEmpty(categories)}">
            <table>
                <thead>
                <tr>
                    <th style="width: 90px;">ID</th>
                    <th>Название категории</th>
                    <th style="text-align: right;">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="category : ${categories}">
                    <td class="cell-id" th:text="'#' + ${category.id}">#1</td>
                    <td class="cell-name">
                        <strong th:text="${category.name}"></strong>
                    </td>
                    <td class="cell-actions" style="display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap;">
                        <a th:href="@{/products(categoryId=${category.id})}" class="action-link">
                            <i class="fas fa-boxes-stacked"></i> Товары
                        </a>
                        <a th:href="@{/products/create(categoryId=${category.id})}" class="action-link action-link--primary">
                            <i class="fas fa-plus"></i> Создать товар
                        </a>
                        <a th:href="@{/categories/update/{id}(id=${category.id})}" class="action-link" title="Редактировать категорию">
                            <i class="fas fa-pen"></i> Изменить
                        </a>
                        <form th:action="@{/categories/delete/{id}(id=${category.id})}"
                              method="post"
                              data-confirm="Вы уверены, что хотите удалить эту категорию?"
                              style="display:inline;margin:0;">
                            <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
                            <button type="submit" class="action-link" style="background:none;border:1px solid #FECACA;color:#B91C1C;cursor:pointer;padding:6px 10px;border-radius:6px;font-size:12px;">
                                <i class="fas fa-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</main>

<div th:insert="~{footer :: footer-code}"></div>
<script th:src="@{/js/navbar-component.js}" defer></script>
</body>
</html>
