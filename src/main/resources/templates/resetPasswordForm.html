<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UXD — Новый пароль</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/authorizationForm.css}">
</head>
<body>
<div class="card">
    <p class="brand">Under <span class="brand-x">X</span> Desire</p>
    <h2>Установка нового пароля</h2>

    <div th:if="${error}" class="error" role="alert" th:text="${error}"></div>

    <form th:unless="${tokenInvalid == true}" th:action="@{/reset-password}" method="post">
        <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
        <input type="hidden" name="token" th:value="${token}">

        <div class="field">
            <label for="newPassword">Новый пароль (минимум 6 символов)</label>
            <input type="password" id="newPassword" name="newPassword" minlength="6" maxlength="72" placeholder="Введите новый пароль" required>
        </div>

        <div class="field">
            <label for="confirmPassword">Повторите пароль</label>
            <input type="password" id="confirmPassword" name="confirmPassword" minlength="6" maxlength="72" placeholder="Повторите новый пароль" required>
        </div>

        <button type="submit">Сохранить пароль</button>
    </form>

    <p class="foot">
        <a th:href="${tokenInvalid == true} ? @{/forgot-password} : @{/login}"
           th:text="${tokenInvalid == true} ? 'Запросить ссылку заново' : 'Вернуться ко входу'">Вернуться</a>
    </p>
</div>
</body>
</html>
