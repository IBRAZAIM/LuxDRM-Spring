<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналитика продаж — UXD Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/navbar.css}">
    <link rel="stylesheet" th:href="@{/admin.css}">
    <link rel="stylesheet" th:href="@{/sales.css}">
    <link rel="stylesheet" th:href="@{/footer.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="admin-body">
<div th:insert="~{navbar :: navigation-panel}"></div>

<main class="admin-shell">
    <div class="admin-container">

        <div th:replace="~{fragments/admin-topbar :: topbar('sales', 'Аналитика')}"></div>

        <header class="admin-header">
            <div>
                <span class="admin-eyebrow">Панель управления UXD</span>
                <h1 class="admin-title">Аналитика продаж</h1>
            </div>
            <div class="header-actions">
                <a class="adm-btn adm-btn--outline" th:href="@{/}">
                    <i class="fas fa-store"></i> На витрину
                </a>
            </div>
        </header>

        <div class="reports">
            <div class="report-toolbar">
                <div class="period-tabs" role="tablist" aria-label="Период аналитики">
                    <button type="button" class="period-btn active" data-period="TODAY">Сегодня</button>
                    <button type="button" class="period-btn" data-period="WEEK">Неделя</button>
                    <button type="button" class="period-btn" data-period="MONTH">Месяц</button>
                    <button type="button" class="period-btn" data-period="QUARTER">Квартал</button>
                    <button type="button" class="period-btn" data-period="YEAR">Год</button>
                    <button type="button" class="period-btn" data-period="ALL">За всё время</button>
                </div>

                <div class="date-range">
                    <label aria-label="Дата начала"><input id="customStart" type="date"></label>
                    <span class="dash">—</span>
                    <label aria-label="Дата окончания"><input id="customEnd" type="date"></label>
                    <button id="applyCustom" class="apply-btn" type="button">Применить</button>
                </div>
            </div>

            <div class="meta-row">
                <span id="periodLabel">Период: сегодня</span>
                <span id="updatedAt">Обновлено: --:--</span>
            </div>

            <div class="report-grid">
                <div class="report-card wide">
                    <h3>Общие продажи</h3>
                    <p id="kpiSales" class="report-value" th:text="${overview.totalSales()}">0</p>
                </div>

                <div class="report-card">
                    <h3>Посещений</h3>
                    <p id="kpiVisits" class="report-value" th:text="${overview.visitsToday()}">0</p>
                </div>

                <div class="report-card">
                    <h3>Заказы</h3>
                    <p id="kpiOrders" class="report-value" th:text="${overview.ordersToday()}">0</p>
                </div>

                <div class="report-card">
                    <h3>Конверсия</h3>
                    <p id="kpiConversion" class="report-value" th:text="${overview.conversion() + '%'}">0%</p>
                </div>

                <div class="report-card">
                    <h3>Средний чек</h3>
                    <p id="kpiAverageCheck" class="report-value">0</p>
                </div>

                <div class="report-card">
                    <h3>Доход с визита</h3>
                    <p id="kpiRevenuePerVisit" class="report-value">0</p>
                </div>
            </div>

            <div class="analytics-grid">
                <div class="report-card chart-card">
                    <h3>Выручка</h3>
                    <div class="chart-wrap"><canvas id="revenueChart"></canvas></div>
                </div>
                <div class="report-card chart-card">
                    <h3>Трафик и заказы</h3>
                    <div class="chart-wrap"><canvas id="trafficChart"></canvas></div>
                </div>
                <div class="report-card chart-card">
                    <h3>Конверсия</h3>
                    <div class="chart-wrap"><canvas id="conversionChart"></canvas></div>
                </div>
                <div class="report-card insights-card">
                    <h3>Ключевые показатели и выводы</h3>
                    <ul id="insightsList"></ul>
                </div>
            </div>
        </div>

    </div>
</main>

<div th:insert="~{footer :: footer-code}"></div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/sales.js}"></script>
<script th:src="@{/js/navbar-component.js}" defer></script>
</body>
</html>
