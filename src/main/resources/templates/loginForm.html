<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UXD — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/tokens.css}">
    <link rel="stylesheet" th:href="@{/authorizationForm.css}">
</head>
<body>
<div class="card">
    <a th:href="@{/}" class="brand" aria-label="На главную UXD">Under <span class="brand-x">X</span> Desire</a>
    <h2>Вход</h2>

    <div th:if="${successMessage}" class="success" role="status">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${loginError == true or param.error != null}" class="error" id="loginErrorMsg" role="alert">
        Неверный логин или пароль
    </div>

    <form th:action="@{/login}" method="post" autocomplete="on">
        <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
        <input type="hidden" name="redirect" th:value="${redirect}"/>

        <div class="field">
            <label for="email">Email или логин</label>
            <input type="text" id="email" name="email"
                   th:value="${email}"
                   placeholder="email или логин"
                   autocomplete="username" required/>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password"
                       placeholder="Ваш пароль"
                       autocomplete="current-password" required/>
                <button type="button" class="pw-toggle" id="togglePwBtn" aria-label="Показать пароль" aria-pressed="false">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>
        </div>

        <div class="auth-row">
            <label class="remember-label">
                <input type="checkbox" name="remember-me">
                <span>Запомнить меня</span>
            </label>
            <a th:href="@{/forgot-password}" class="forgot-link">Забыли пароль?</a>
        </div>

        <button type="submit">Войти</button>
    </form>

    <p class="foot">Нет аккаунта? <a th:href="@{/register}">Создать</a></p>
    <a th:href="@{/}" class="back-home">← Вернуться в магазин</a>
</div>
<script>
    (function () {
        const btn = document.getElementById('togglePwBtn');
        const inp = document.getElementById('password');
        if (!btn || !inp) return;
        btn.addEventListener('click', function () {
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            btn.setAttribute('aria-pressed', String(show));
            btn.setAttribute('aria-label', show ? 'Скрыть пароль' : 'Показать пароль');
        });
    })();
</script>
</body>
</html>
