<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UXD — Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/authorizationForm.css}">
</head>
<body>
<div class="card">
    <p class="brand">Under <span class="brand-x">X</span> Desire</p>
    <h2>Вход</h2>

    <div th:if="${successMessage}" class="success" style="background: #ecfdf5; color: #065f46; padding: 10px 14px; border-radius: 0; font-size: 12px; margin-bottom: 16px; border: 1px solid #a7f3d0; text-align: center;">
        <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${loginError == true or param.error != null}" class="error" role="alert">
        Неверный логин или пароль
    </div>

    <form th:action="@{/login}" method="post" autocomplete="on">
        <th:block th:replace="~{fragments/csrf :: csrfToken}"></th:block>
        <input type="hidden" name="redirect" th:value="${redirect}"/>

        <div class="field">
            <label for="email">Email или логин</label>
            <input type="text" id="email" name="email"
                   th:value="${email}"
                   placeholder="email или логин"
                   autocomplete="username" required/>
        </div>

        <div class="field">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password"
                   placeholder="Ваш пароль"
                   autocomplete="current-password" required/>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; margin: 12px 0 18px; gap: 12px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: #555;">
                <input type="checkbox" name="remember-me" style="cursor: pointer; width: 16px; height: 16px;">
                <span>Запомнить меня</span>
            </label>
            <a th:href="@{/forgot-password}" style="font-size: 13px; color: #0c0c3d; text-decoration: none; border-bottom: 1px solid rgba(12,12,61,0.3);">Забыли пароль?</a>
        </div>

        <button type="submit">Войти</button>
    </form>

    <p class="foot">Нет аккаунта? <a th:href="@{/register}">Создать</a></p>
</div>
</body>
</html>
