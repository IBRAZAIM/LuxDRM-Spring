spring.application.name=Catalog

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/uxd}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:INFO}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

app.upload.dir=${UPLOAD_DIR:uploads/products}
app.upload.banners-dir=${BANNERS_UPLOAD_DIR:uploads/banners}

server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
server.compression.min-response-size=1024

# Payment Gateway Integration (sandbox | external)
payment.gateway.mode=${PAYMENT_GATEWAY_MODE:sandbox}
payment.gateway.external-checkout-url=${PAYMENT_GATEWAY_URL:}
payment.gateway.merchant-id=${PAYMENT_MERCHANT_ID:LUXDRM_MERCHANT_01}
payment.gateway.webhook-secret=${PAYMENT_WEBHOOK_SECRET:luxdrm-webhook-secret-key}
payment.gateway.return-base-url=${PAYMENT_RETURN_BASE_URL:http://localhost:8080}

server.address=0.0.0.0
server.port=${PORT:8080}

# Notifications (Telegram Bot + Logs)
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.notifications.enabled=${NOTIFICATIONS_ENABLED:true}

# Security
app.security.remember-me-key=${APP_REMEMBER_ME_KEY:uxd-dev-remember-me-key-change-in-prod}
server.error.include-stacktrace=never

spring.thymeleaf.cache=${THYMELEAF_CACHE:false}
spring.web.resources.cache.period=${STATIC_CACHE_PERIOD:0}
